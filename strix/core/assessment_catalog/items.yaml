# GENERATED by scripts/generate_assessment_catalog.py from section 5 of
# PENTEST-11-DOCUMENTACAO-PRODUTO-CONSOLIDADA.md. Do not edit by hand.
# The source text is kept verbatim (Portuguese) because that document is the authority for
# the catalog; English labels for the curated items live in selection.yaml.
catalog_version: 1
families:
- id: '5.1'
  title: Inventário, superfície e modelo de ameaças
  items:
  - id: 5.1.1
    text: Identificar domínios, aplicações, APIs, repositórios, serviços e integrações; registrar propriedade
      e inclusão no escopo.
  - id: 5.1.2
    text: Mapear rotas, métodos, parâmetros, formulários, interfaces administrativas e tarefas assíncronas.
  - id: 5.1.3
    text: Comparar documentação, especificações, tráfego e código; registrar interfaces encontradas em
      apenas uma fonte.
  - id: 5.1.4
    text: Identificar usuários, papéis, tenants, dados sensíveis e fronteiras de confiança.
  - id: 5.1.5
    text: Relacionar jornadas críticas, operações sensíveis, hipóteses e casos aplicáveis.
  - id: 5.1.6
    text: Registrar acessos ausentes, ativos não alcançáveis e diferenças entre ambientes.
  conditions: '**Condição e evidência:** informar as fontes do inventário e os pontos de observação. Descobrir
    uma rota não significa testá-la. **Base:** reconhecimento, descoberta orientada a código, especificações
    de API e modelo de ameaças existentes. [S04] [S09]'
- id: '5.2'
  title: Rede, exposição e segmentação
  items:
  - id: 5.2.1
    text: Inventariar serviços TCP e UDP e relacionar cada um à função esperada.
  - id: 5.2.2
    text: Comparar acesso a partir de Internet, redes de clientes, servidores, administração e NOC, conforme
      o ambiente.
  - id: 5.2.3
    text: Verificar exposição de painéis, SSH, RDP, SMB, bancos de dados e serviços de gerenciamento.
  - id: 5.2.4
    text: Avaliar autenticação, transporte e divulgação de informações nos protocolos presentes, incluindo
      SNMP e NTP.
  - id: 5.2.5
    text: Comparar a aplicação das regras em IPv4 e IPv6.
  - id: 5.2.6
    text: Verificar caminhos de acesso entre segmentos que deveriam permanecer separados.
  conditions: '**Condição e evidência:** possuir matriz de acesso esperado e pontos de observação pertinentes;
    registrar origem, destino, porta, protocolo e resultado. Uma porta aberta isoladamente não comprova
    vulnerabilidade. **Base:** ferramentas e guias de reconhecimento; perfis verificáveis por serviço
    e segmento são incremento proposto. [S04]'
- id: '5.3'
  title: TLS, certificados e SSH
  items:
  - id: 5.3.1
    text: Verificar cadeia de confiança, identidade do serviço, nomes e validade dos certificados.
  - id: 5.3.2
    text: Avaliar protocolos, algoritmos e parâmetros negociados conforme a política escolhida.
  - id: 5.3.3
    text: Comparar comportamento por nome, SNI, IP, porta, balanceador e ponto de terminação.
  - id: 5.3.4
    text: Verificar transporte de serviços que usam STARTTLS ou mecanismos equivalentes.
  - id: 5.3.5
    text: Auditar algoritmos SSH, chaves de host e métodos de autenticação administrativa.
  - id: 5.3.6
    text: Distinguir configuração observada remotamente da configuração local efetivamente aplicada.
  conditions: '**Condição e evidência:** registrar política, versão da ferramenta, cadeia/negociação e
    contexto de confiança, incluindo CAs internas. **Incremento:** adaptadores dedicados, saída estruturada
    e fixtures de configuração válida e inválida; avaliar SSLyze ou testssl.sh e ssh-audit. [T01] [T02]
    [T03]'
- id: '5.4'
  title: DNS e ciclo de vida de domínios
  items:
  - id: 5.4.1
    text: Revisar delegações, servidores autoritativos, secundários e registros reversos.
  - id: 5.4.2
    text: Verificar recursão e transferência de zona conforme a função e os clientes permitidos.
  - id: 5.4.3
    text: Avaliar DNSSEC e CAA quando adotados ou exigidos pelo perfil.
  - id: 5.4.4
    text: Identificar registros obsoletos, serviços desativados e dependências de terceiros.
  - id: 5.4.5
    text: Verificar exposição de nomes e divergências de resolução que afetem controles.
  conditions: '**Condição e evidência:** domínio, papel do servidor, consulta, resposta e expectativa
    documentada. Ausência de uma funcionalidade opcional exige contexto antes de receber severidade. Tomada
    de subdomínio é detalhada em 5.19. **Base:** descoberta e ciclo de vida de infraestrutura; perfil
    completo de DNS proposto. [S04]'
- id: '5.5'
  title: Correio eletrônico e identidade de envio
  items:
  - id: 5.5.1
    text: Inventariar domínios e serviços autorizados a enviar mensagens.
  - id: 5.5.2
    text: Verificar SPF, DKIM e DMARC, incluindo alinhamento e remetentes legítimos.
  - id: 5.5.3
    text: Avaliar autenticação SMTP, encaminhamento indevido e transporte.
  - id: 5.5.4
    text: Verificar exposição de informações em respostas, cabeçalhos e interfaces de administração.
  - id: 5.5.5
    text: Avaliar tratamento de mensagens e registros de autenticação usando destinatários controlados.
  conditions: '**Condição e evidência:** acesso a configuração pertinente, seletores DKIM ou mensagens
    representativas; registrar cabeçalhos sanitizados e resultado do fluxo. **Incremento:** perfil de
    correio com configuração esperada e casos próprios.'
- id: '5.6'
  title: Sistemas operacionais, serviços e virtualização
  items:
  - id: 5.6.1
    text: Inventariar versões, pacotes, serviços e configurações relevantes.
  - id: 5.6.2
    text: Correlacionar vulnerabilidades conhecidas considerando versão efetiva, correções do fornecedor
      e backports.
  - id: 5.6.3
    text: Avaliar privilégios administrativos, contas de serviço, permissões de arquivos e tarefas automáticas.
  - id: 5.6.4
    text: Verificar firewall local, canais de administração e acesso a backups e armazenamento compartilhado.
  - id: 5.6.5
    text: Examinar isolamento e exposição de gerenciamento em hipervisores e máquinas virtuais.
  - id: 5.6.6
    text: Conferir registro das ações de teste e proteção dos dados administrativos.
  conditions: '**Condição e evidência:** configuração autenticada, exportações ou observações suficientes
    para distinguir hipótese de permissão efetiva. **Incremento:** perfis por sistema e produto; não presumir
    um perfil completo de Debian ou Proxmox pela presença de ferramentas genéricas.'
- id: '5.7'
  title: Active Directory e identidades corporativas
  items:
  - id: 5.7.1
    text: Mapear domínios, relações de confiança, grupos privilegiados e delegações.
  - id: 5.7.2
    text: Examinar permissões sobre objetos, grupos, credenciais e configurações sensíveis.
  - id: 5.7.3
    text: Avaliar contas de serviço, administração local e caminhos de elevação de privilégio.
  - id: 5.7.4
    text: Verificar protocolos legados, requisitos de assinatura, proteção de autenticação e transporte.
  - id: 5.7.5
    text: Examinar emissão e modelos de certificados quando houver AD CS.
  - id: 5.7.6
    text: Demonstrar as condições de um caminho de acesso relevante; registrar controles que interrompem
      a cadeia.
  conditions: '**Condição e evidência:** identidades e permissões de leitura/teste compatíveis; grafos
    de relações não substituem a validação de permissões e pré-condições. **Base:** guia de Active Directory
    já existente; integração e cobertura verificável precisam ser avaliadas por caso. [S04]'
- id: '5.8'
  title: 'Cloud: AWS, Azure e GCP'
  items:
  - id: 5.8.1
    text: Inventariar contas, assinaturas, projetos, regiões e recursos expostos.
  - id: 5.8.2
    text: Avaliar IAM, relações de confiança, delegação e identidades de workloads.
  - id: 5.8.3
    text: Verificar acesso a objetos, bancos, snapshots, backups e registries.
  - id: 5.8.4
    text: Examinar redes, entrada/saída, acesso administrativo e fronteiras entre ambientes.
  - id: 5.8.5
    text: Avaliar segredos, chaves, configuração de criptografia e acesso aos registros de auditoria.
  - id: 5.8.6
    text: Relacionar permissões configuradas à identidade efetiva e à operação que ela consegue realizar.
  conditions: '**Condição e evidência:** recurso, identidade, política, condição e resultado; explicitar
    limites de uma revisão apenas de configuração. **Base:** guias AWS, Azure e GCP existentes. [S04]'
- id: '5.9'
  title: Containers, registries e Kubernetes
  items:
  - id: 5.9.1
    text: Verificar autenticação, RBAC e contas de serviço.
  - id: 5.9.2
    text: Examinar privilégios, capabilities, volumes e acesso ao host.
  - id: 5.9.3
    text: Avaliar segmentação entre namespaces, workloads e serviços.
  - id: 5.9.4
    text: Verificar imagens, dependências, segredos e permissões de registries.
  - id: 5.9.5
    text: Revisar políticas de admissão, exposição administrativa e auditoria.
  - id: 5.9.6
    text: Relacionar configuração declarada e configuração em execução.
  conditions: '**Condição e evidência:** manifestos, versão e estado do cluster, identidade e operação
    relevante. **Base:** guia Kubernetes existente; ampliar com casos e adaptadores quando necessário.
    [S04]'
- id: '5.10'
  title: IaC, CI/CD e cadeia de entrega
  items:
  - id: 5.10.1
    text: Revisar permissões de workflows, identidades de implantação e acesso a segredos.
  - id: 5.10.2
    text: Verificar processamento de conteúdo não confiável em eventos, scripts e etapas de build.
  - id: 5.10.3
    text: Avaliar origem, fixação de versões e procedência de actions, imagens e dependências.
  - id: 5.10.4
    text: Examinar isolamento de runners, persistência de credenciais e acesso à rede interna.
  - id: 5.10.5
    text: Revisar IaC quanto a exposição, privilégios e configurações sensíveis.
  - id: 5.10.6
    text: Rastrear a integridade entre código, compilação, artefato e implantação.
  conditions: '**Condição e evidência:** arquivos de configuração, contexto dos eventos e identidades
    efetivas. **Incremento:** perfil dedicado ao alvo. Ferramentas usadas pelo CI do próprio Strix não
    comprovam que ele faça essa auditoria em todos os projetos. [S23]'
- id: '5.11'
  title: Autenticação, senhas, JWT e sessões
  items:
  - id: 5.11.1
    text: Verificar credenciais fracas ou padrões aplicáveis dentro dos limites de tentativas definidos.
  - id: 5.11.2
    text: Avaliar recuperação de conta, alteração de senha e troca de identificadores.
  - id: 5.11.3
    text: Examinar MFA, desafios adicionais e caminhos alternativos de autenticação.
  - id: 5.11.4
    text: Verificar criação, renovação, expiração, revogação e encerramento das sessões.
  - id: 5.11.5
    text: Validar assinatura, algoritmo, emissor, destinatário, tempo e contexto de JWTs.
  - id: 5.11.6
    text: Avaliar limitação de tentativas e respostas que revelem contas ou estados sensíveis.
  - id: 5.11.7
    text: Confirmar efeito de mudanças de senha, papel e tenant nas sessões existentes.
  conditions: '**Condição e evidência:** contas de teste, estado válido de sessão e comportamento legítimo
    de referência. **Base:** guias de autenticação/JWT e senhas fracas existentes. [S04]'
- id: '5.12'
  title: Autorização, IDOR/BOLA, BFLA e atributos
  items:
  - id: 5.12.1
    text: Testar acesso a objetos de outro usuário ou tenant em leitura, alteração, exclusão, exportação
      e compartilhamento.
  - id: 5.12.2
    text: Verificar funções reservadas a outros papéis e interfaces administrativas.
  - id: 5.12.3
    text: Examinar alteração de atributos protegidos por vinculação automática de campos.
  - id: 5.12.4
    text: Comparar controles em operações individuais, lotes, recursos relacionados e caminhos alternativos.
  - id: 5.12.5
    text: Verificar revogação de acesso após mudanças de propriedade, papel ou associação organizacional.
  - id: 5.12.6
    text: Comparar dono, outro usuário, outro tenant, administrador e anônimo, conforme aplicável.
  conditions: '**Condição e evidência:** matriz de permissões e recursos controlados; duas contas com
    papéis ou propriedade distintos são uma pré-condição frequente. **Base:** IDOR, BFLA e mass assignment
    existentes. [S04]'
- id: '5.13'
  title: Lógica de negócio, estados e concorrência
  items:
  - id: 5.13.1
    text: Verificar se etapas críticas podem ser omitidas, repetidas ou executadas fora de ordem.
  - id: 5.13.2
    text: Avaliar conservação de saldo, preços, descontos, impostos, moedas e arredondamentos.
  - id: 5.13.3
    text: Examinar pagamento, cancelamento, reembolso, cupom, estoque, assinatura e limites de uso.
  - id: 5.13.4
    text: Verificar idempotência e associação de identificadores à operação e identidade corretas.
  - id: 5.13.5
    text: Testar concorrência sobre recursos finitos e operações de uso único.
  - id: 5.13.6
    text: Avaliar filas, repetição, falha parcial, compensação e consistência entre serviços.
  conditions: '**Condição e evidência:** regra de negócio explícita, estado inicial/final e registro persistente.
    Retorno HTTP de sucesso não comprova alteração de saldo ou conclusão da operação. **Base:** business
    logic e race conditions existentes; casos históricos podem orientar fixtures. [S04] [B02]'
- id: '5.14'
  title: Consultas e estruturas de dados
  items:
  - id: 5.14.1
    text: Verificar se entradas externas alteram a estrutura de consultas SQL ou a seleção de registros.
  - id: 5.14.2
    text: Examinar filtros, operadores, consultas e opções de bancos NoSQL.
  - id: 5.14.3
    text: Rastrear estruturas recebidas por APIs ou GraphQL até o ponto em que são interpretadas.
  - id: 5.14.4
    text: Verificar mesclagem, atribuição e reconstrução de objetos quanto a prototype pollution.
  - id: 5.14.5
    text: Avaliar efeitos posteriores de dados armazenados e demonstrar sua consequência de segurança.
  conditions: '**Condição e evidência:** componente identificado, entrada, ponto de interpretação e diferença
    controlada. Um erro de sintaxe isolado é indício, não prova de acesso indevido. **Base:** SQLi, NoSQLi
    e prototype pollution existentes. [S04] [B03]'
- id: '5.15'
  title: Execução, argumentos, templates e desserialização
  items:
  - id: 5.15.1
    text: Examinar entradas que alcançam execução de processos ou avaliação dinâmica.
  - id: 5.15.2
    text: Verificar alteração de opções e argumentos de programas, inclusive sem shell.
  - id: 5.15.3
    text: Avaliar dados interpretados como expressões ou instruções de templates no servidor.
  - id: 5.15.4
    text: Examinar desserialização, integridade dos dados, tipos permitidos e bibliotecas efetivas.
  - id: 5.15.5
    text: Incluir processamento assíncrono, documentos, conversões e integrações.
  - id: 5.15.6
    text: Confirmar alcançabilidade, contexto e efeito por um marcador controlado adequado ao caso.
  conditions: '**Condição e evidência:** caminho entre entrada, interpretação e efeito; compatibilidade
    com componente e versão. **Base:** RCE, argument injection, SSTI e desserialização insegura existentes.
    [S04]'
- id: '5.16'
  title: Arquivos, diretórios, uploads e XML
  items:
  - id: 5.16.1
    text: Verificar acesso fora dos diretórios permitidos e inclusão indevida de conteúdo.
  - id: 5.16.2
    text: Examinar escrita, extração de arquivos, links e normalização do destino.
  - id: 5.16.3
    text: Avaliar nome, conteúdo, tipo detectado, armazenamento e acesso a uploads.
  - id: 5.16.4
    text: Verificar fronteiras entre upload, análise, transformação e publicação.
  - id: 5.16.5
    text: Examinar resolução de entidades e referências externas em XML.
  - id: 5.16.6
    text: Confirmar o comportamento de consumidores posteriores do arquivo.
  conditions: '**Condição e evidência:** arquivo ou marcador de teste, destino real e processamento observado.
    **Base:** path traversal/LFI/RFI, uploads inseguros e XXE existentes. [S04]'
- id: '5.17'
  title: Navegador, origens e conteúdo ativo
  items:
  - id: 5.17.1
    text: Verificar XSS em respostas, conteúdo armazenado e operações de DOM.
  - id: 5.17.2
    text: Examinar construção de caminhos no cliente que alcance operações diferentes das previstas.
  - id: 5.17.3
    text: Avaliar CSRF em operações sensíveis e os controles aplicados ao contexto de navegação.
  - id: 5.17.4
    text: Verificar redirecionamentos controláveis e sua consequência no fluxo.
  - id: 5.17.5
    text: Examinar CORS, comunicação entre janelas, validação de origem e contextos incorporados.
  - id: 5.17.6
    text: Avaliar cookies, armazenamento, workers e políticas de isolamento.
  - id: 5.17.7
    text: Demonstrar informação ou ação exposta entre origens, incluindo vazamentos por diferenças observáveis
      de estado.
  conditions: '**Condição e evidência:** navegador, origem, identidade, contexto e efeito reproduzível;
    ausência de um cabeçalho não determina sozinha a severidade. **Base:** XSS, CSPT, CSRF, open redirect
    e browser security existentes. [S04]'
- id: '5.18'
  title: HTTP, proxies, caches e semântica
  items:
  - id: 5.18.1
    text: Verificar divergências de delimitação de mensagens entre componentes HTTP.
  - id: 5.18.2
    text: Examinar influência sobre cabeçalhos, host e encaminhamento interno.
  - id: 5.18.3
    text: Avaliar chaves de cache, variações por identidade e compartilhamento de respostas.
  - id: 5.18.4
    text: Comparar interpretação de caminhos, métodos, duplicatas e codificações.
  - id: 5.18.5
    text: Verificar decisões de segurança tomadas sobre uma interpretação diferente da operação final.
  - id: 5.18.6
    text: Confirmar o componente responsável e o efeito sobre outro contexto de acesso.
  conditions: '**Condição e evidência:** topologia conhecida ou inferida com fundamento, mensagens e consequência
    observada. **Base:** request smuggling, header injection e semantic confusion existentes. [S04]'
- id: '5.19'
  title: SSRF, conexões externas e recursos abandonados
  items:
  - id: 5.19.1
    text: Inventariar funções que fazem conexões a partir de dados influenciáveis.
  - id: 5.19.2
    text: Verificar destino efetivo após resolução de nomes, redirecionamentos e normalização.
  - id: 5.19.3
    text: Determinar métodos, cabeçalhos, respostas e serviços efetivamente alcançáveis.
  - id: 5.19.4
    text: Verificar referências DNS e integrações abandonadas quanto à possibilidade atual de controle
      por terceiros.
  - id: 5.19.5
    text: Relacionar propriedade, expiração, exclusão e recriação de recursos vinculados.
  - id: 5.19.6
    text: Quando houver teste fora de banda, correlacionar callback e tentativa; registrar indisponibilidade
      do coletor ou da conectividade.
  conditions: '**Condição e evidência:** destino controlado, vínculo e capacidade comprovados. Referência
    quebrada não prova takeover; ausência de callback não descarta SSRF. **Base:** SSRF, subdomain takeover
    e ciclo de vida existentes. Coletor interno é uma opção de implantação a validar. [S04] [T04]'
- id: '5.20'
  title: Código, configurações e divulgação de informação
  items:
  - id: 5.20.1
    text: Examinar respostas, erros, logs, backups, arquivos publicados e artefatos de build.
  - id: 5.20.2
    text: Distinguir informação pública de dados protegidos e segredos com capacidade efetiva.
  - id: 5.20.3
    text: Rastrear entrada, controles, operação sensível e efeito dos alertas estáticos.
  - id: 5.20.4
    text: Verificar configuração real, condições de implantação e caminhos alternativos.
  - id: 5.20.5
    text: Em revisão de mudança, relacionar o risco ao diff e aos componentes afetados.
  - id: 5.20.6
    text: 'Procurar contraevidência: validação anterior, autorização no servidor, configuração segura
      ou caminho inalcançável.'
  conditions: '**Condição e evidência:** commit, localização, fluxo e condições de execução. Análise estática
    pode sustentar conclusão quando a cadeia está demonstrada, com limites explicitados. **Base:** information
    disclosure, SAST orientado a código, diff e contraevidência existentes. [S03] [S04]'
- id: '5.21'
  title: Dependências, pacotes e segredos de desenvolvimento
  items:
  - id: 5.21.1
    text: Inventariar dependências diretas e transitivas com versões resolvidas.
  - id: 5.21.2
    text: Verificar aplicabilidade de avisos e CVEs ao componente e ao uso real.
  - id: 5.21.3
    text: Examinar fontes de pacotes, resolução de nomes e dependências de ferramentas de desenvolvimento.
  - id: 5.21.4
    text: Revisar segredos presentes em código, histórico e artefatos, sem reproduzi-los em relatórios
      compartilháveis.
  - id: 5.21.5
    text: Avaliar integridade e procedência de componentes incorporados.
  - id: 5.21.6
    text: Confirmar a correção e o funcionamento legítimo após atualização ou mudança de configuração.
  conditions: '**Condição e evidência:** manifestos, lockfiles, artefatos e contexto do aviso. Presença
    de versão mencionada num advisory exige análise de alcance e das condições da falha. **Base:** dependency/CVE
    scanning, npx confusion e fix verification existentes. [S04]'
- id: '5.22'
  title: APIs, protocolos, frameworks e serviços gerenciados
  items:
  - id: 5.22.1
    text: Comparar operações, parâmetros e versões implementadas com OpenAPI ou contrato equivalente.
  - id: 5.22.2
    text: Em GraphQL, avaliar resolvers, campos aninhados, batching, aliases, subscriptions e limites
      de custo.
  - id: 5.22.3
    text: Em OAuth/OIDC, verificar cliente, fluxo, sessão, destinatário, redirecionamento e autorização
      concedida.
  - id: 5.22.4
    text: Em WebSockets e eventos, verificar autenticação e autorização durante o ciclo da conexão.
  - id: 5.22.5
    text: Examinar middleware, ordem de rotas, handlers especiais e execução cliente/servidor.
  - id: 5.22.6
    text: Avaliar políticas no serviço que decide o acesso, incluindo Auth0, Firebase e Supabase.
  - id: 5.22.7
    text: Verificar APIs internas, integrações e versões antigas ainda alcançáveis.
  conditions: '**Condição e evidência:** protocolo, implementação, configuração e ponto onde o controle
    é aplicado. Esta família especializa os testes de autenticação, autorização, negócio e entrada; não
    os substitui. **Base:** guias de protocolos, frameworks e serviços existentes. [S04]'
- id: '5.23'
  title: Aplicações LLM, RAG e memória
  items:
  - id: 5.23.1
    text: Verificar se entradas diretas ultrapassam regras de acesso ou revelam conteúdo protegido.
  - id: 5.23.2
    text: Examinar instruções indiretas em páginas, documentos, índices, imagens e resultados recuperados.
  - id: 5.23.3
    text: Avaliar isolamento entre usuários e tenants em documentos, histórico, memória e índices.
  - id: 5.23.4
    text: Verificar ingestão, atualização, revogação e exclusão de documentos e permissões.
  - id: 5.23.5
    text: Examinar respostas e citações que exponham informação além da autorização.
  - id: 5.23.6
    text: Testar persistência indevida de instruções ou dados entre conversas e tarefas.
  - id: 5.23.7
    text: Medir repetibilidade das falhas e dos controles com versão, configuração e conjunto de casos
      registrados.
  conditions: '**Condição e evidência:** usuários e documentos controlados, origem da entrada e efeito
    observado. Resposta verbal inadequada não comprova automaticamente acesso a segredos ou execução de
    ferramenta. **Base:** prompt injection e aplicações LLM/RAG já possuem guias. [S04] [S12]'
- id: '5.24'
  title: Agentes, ferramentas e MCP no alvo
  items:
  - id: 5.24.1
    text: Verificar se chamadas de ferramentas preservam identidade, recurso e permissões do solicitante.
  - id: 5.24.2
    text: Examinar descrições, metadados e respostas de ferramentas como conteúdo externo.
  - id: 5.24.3
    text: Avaliar delegação entre agentes e propagação de escopo e limites.
  - id: 5.24.4
    text: Verificar execução de ações sensíveis, confirmação exigida pelo produto e possibilidade de repetição.
  - id: 5.24.5
    text: Examinar atualização de ferramentas, permissões MCP e dependências de confiança.
  - id: 5.24.6
    text: Confirmar divulgação, chamada, alteração ou persistência indevida por evidência externa ao texto
      do modelo.
  conditions: '**Condição e evidência:** sistema agente controlado, ferramentas instrumentadas e dados
    de teste. Os testes do próprio Strix estão na seção 6. **Base:** agentic system security e integração
    MCP existentes. [S04] [S11]'
- id: '5.25'
  title: Aplicações móveis
  items:
  - id: 5.25.1
    text: Avaliar armazenamento local de tokens, credenciais e dados pessoais.
  - id: 5.25.2
    text: Examinar permissões, componentes expostos e comunicação entre processos.
  - id: 5.25.3
    text: Verificar transporte e confiança em certificados conforme o modelo de ameaça.
  - id: 5.25.4
    text: Avaliar links profundos, autenticação e APIs consumidas pelo aplicativo.
  - id: 5.25.5
    text: Examinar builds de produção, depuração, logs e arquivos sensíveis.
  conditions: '**Condição e evidência:** APK/IPA ou código pertinente, dispositivo/emulador e contas de
    teste. **Base parcial:** OAuth, JWT, Firebase e APIs; uma avaliação nativa completa exige perfil e
    ambiente próprios. Não tratar ausência de pinning, isoladamente, como prova de falha.'
- id: '5.26'
  title: Aplicações desktop
  items:
  - id: 5.26.1
    text: Avaliar isolamento entre conteúdo remoto e processos privilegiados.
  - id: 5.26.2
    text: Examinar IPC, navegação, handlers e acesso ao sistema de arquivos.
  - id: 5.26.3
    text: Verificar armazenamento de credenciais e permissões locais.
  - id: 5.26.4
    text: Avaliar assinatura, origem e integridade de atualizações.
  - id: 5.26.5
    text: Examinar integração com serviços locais e limites entre aplicação e sistema operacional.
  conditions: '**Condição e evidência:** pacote, versão, sistema operacional e conteúdo de teste. **Base:**
    guia Electron existente; outros runtimes exigem procedimentos específicos. [S04]'
- id: '5.27'
  title: Equipamentos, firmware e infraestrutura de provedor
  items:
  - id: 5.27.1
    text: Inventariar modelos, firmware, funções e interfaces de gerenciamento.
  - id: 5.27.2
    text: Avaliar contas, gerenciamento remoto e separação de redes administrativas.
  - id: 5.27.3
    text: Examinar protocolos, transporte e exposição conforme a função do equipamento.
  - id: 5.27.4
    text: Verificar integridade, origem e processo de atualização de firmware.
  - id: 5.27.5
    text: Revisar exportações de configuração, segredos e integrações do fornecedor.
  - id: 5.27.6
    text: Quando pertinente ao escopo Blue3, revisar políticas de roteamento, filtros e validação de rotas
      nos equipamentos próprios.
  conditions: '**Condição e evidência:** modelo exato, documentação, configuração e equipamento de laboratório
    para verificações invasivas. **Incremento:** perfis de roteadores, switches, CPEs e demais produtos
    utilizados. Teste web ou Nmap não equivale a auditoria completa de firmware, BGP ou hardware.'
- id: '5.28'
  title: Consumo de recursos, abuso e disponibilidade
  items:
  - id: 5.28.1
    text: Avaliar limites de operações dispendiosas, paginação, buscas e processamento de arquivos.
  - id: 5.28.2
    text: Verificar cotas por usuário, tenant, credencial e recurso.
  - id: 5.28.3
    text: Examinar custo e limites de APIs externas, mensagens e chamadas a modelos.
  - id: 5.28.4
    text: Avaliar acúmulo de filas, timeouts e comportamento diante de falhas de dependências.
  - id: 5.28.5
    text: Verificar sinais de degradação e condições automáticas de parada do teste.
  conditions: '**Condição e evidência:** limites mensuráveis e carga controlada em ambiente adequado.
    Um pentest comum não inclui automaticamente ensaio de capacidade ou indisponibilidade. **Base parcial:**
    casos de negócio e protocolos; procedimentos de desempenho e resiliência exigem plano próprio. [O02]'
- id: '5.29'
  title: Módulos adicionais condicionais
  items:
  - id: 5.29.1
    text: Em redes sem fio, avaliar autenticação, segmentação e administração com equipamentos e local
      definidos.
  - id: 5.29.2
    text: Em OT/ICS, avaliar arquitetura, acessos e configuração com procedimento compatível com o processo
      físico.
  - id: 5.29.3
    text: Em engenharia social e segurança física, definir objetivos, população, evidências e limites
      específicos da avaliação.
  - id: 5.29.4
    text: Em binários e componentes nativos, avaliar formatos, parsers e memória com ambientes de reprodução.
  - id: 5.29.5
    text: Em exercícios de detecção, correlacionar ações controladas com logs, alertas e resposta esperada.
  conditions: '**Condição e evidência:** perfil especializado e pré-condições próprias. O awesome-pentest
    ajuda a encontrar referências; esses módulos não passam a existir no Strix apenas por constarem de
    um índice. Devem entrar no produto conforme demanda e validação, depois da primeira entrega. [A01]'
