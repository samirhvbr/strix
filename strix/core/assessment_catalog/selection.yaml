# Curated selection over items.yaml (the 171-check catalog stays whole there).
#
# weight: essential    A runtime adapter receipt can close it (see closes_with). Gated by the
#                      version-1 obligation plan, not by this file.
# weight: consultative Shown in the report, never fails a run. Applicable only when its facts hold.
# Every other catalog item is consultative with no declared fact, so it is counted as "not
# selected" and never gates anything.
#
# closes_with.scope says how much of the item as written the adapter exercises:
#   full     the adapter exercises the item for the asset the approved case declares
#   partial  the adapter exercises only part of what the item names; `limits` says what is left
#
# Facts are a closed vocabulary (see FACTS in catalog.py); an unknown fact fails the load.
# At most `essential_limit` items may be essential (the owner's 10-15 ceiling is a ceiling).
selection_version: 1
essential_limit: 15
items:
  "5.12.1":
    weight: essential
    label: Cross-tenant private object read
    coverage_class: idor
    applies_when: [case.authorization]
    closes_with:
      adapter: http.private-read
      scope: partial
      limits: Exercises read access only; modify, delete, export and share are not exercised.
      limits_pt: "Exercita apenas o acesso de leitura; alterar, excluir, exportar e compartilhar não são exercitados."
  "5.13.5":
    weight: essential
    label: Single-use credit under concurrency
    coverage_class: race_conditions
    applies_when: [case.business]
    closes_with:
      adapter: http.single-credit
      scope: full
      limits: Covers the one single-credit resource the approved case declares.
      limits_pt: "Cobre o único recurso de crédito único que o caso aprovado declara."
  "5.3.1":
    weight: essential
    label: Certificate chain, name and validity
    coverage_class: null
    applies_when: [transport.tls]
    closes_with:
      adapter: openssl.tls
      scope: full
      limits: Verified with the default trust store plus the CA the case declares, if any.
      limits_pt: "Verificado com o repositório de confiança padrão mais a CA que o caso declara, se houver."
  "5.3.2":
    weight: essential
    label: TLS protocols and algorithms
    coverage_class: null
    applies_when: [transport.tls]
    closes_with:
      adapter: openssl.tls
      scope: partial
      limits: >-
        Enforces TLS 1.2 or newer and records the negotiated protocol; cipher suites and
        parameters are not evaluated.
      limits_pt: "Exige TLS 1.2 ou superior e registra o protocolo negociado; suítes de cifras e parâmetros não são avaliados."
  "5.3.5":
    weight: essential
    label: SSH algorithms, host keys and authentication
    coverage_class: null
    applies_when: [transport.ssh]
    closes_with:
      adapter: ssh-audit
      scope: partial
      limits: >-
        Audits key exchange, host key, cipher and MAC algorithms; authentication methods are
        not audited.
      limits_pt: "Audita algoritmos de troca de chaves, chave do host, cifras e MACs; os métodos de autenticação não são auditados."

  # Consultative in the first cut. 5.12.2 and 5.12.6 need identities the private-read adapter does
  # not compare (other role, administrator, anonymous); the web items below need a runtime proxy
  # receipt before they can be essential.
  "5.12.2":
    weight: consultative
    label: Functions reserved to other roles
    coverage_class: broken_function_level_authorization
    applies_when: [case.authorization]
  "5.12.6":
    weight: consultative
    label: Owner, other user, other tenant, administrator and anonymous
    coverage_class: idor
    applies_when: [case.authorization]
  "5.13.4":
    weight: consultative
    label: Idempotency and identifier binding
    coverage_class: business_logic
    applies_when: [case.business]
  # Essential since 15/10 (PT-23, owner answer on `pt23-via`): http.web-hygiene is one runtime
  # case, one real request, four independent sub-verdicts — each item below names which.
  "5.17.4":
    weight: essential
    label: Controllable redirects
    coverage_class: open_redirect
    applies_when: [case.web_hygiene]
    closes_with:
      adapter: http.web-hygiene
      check: redirect
      scope: partial
      limits: >-
        Exercises only the one declared redirect parameter against one declared out-of-scope
        destination; other parameters and the consequence further down the flow are not exercised.
      limits_pt: "Exercita apenas o parâmetro de redirecionamento declarado contra um destino fora do escopo também declarado; outros parâmetros e a consequência mais adiante no fluxo não são exercitados."
  "5.17.5":
    weight: essential
    label: CORS and origin validation
    coverage_class: browser_security
    applies_when: [case.web_hygiene]
    closes_with:
      adapter: http.web-hygiene
      check: cors
      scope: partial
      limits: >-
        Reads only the Access-Control-Allow-Origin and -Credentials headers on the one probe
        response; window messaging and embedded contexts are not exercised.
      limits_pt: "Lê apenas os cabeçalhos Access-Control-Allow-Origin e -Credentials na resposta da única sondagem; comunicação entre janelas e contextos incorporados não são exercitados."
  "5.17.6":
    weight: essential
    label: Cookies, storage and isolation policies
    coverage_class: browser_security
    applies_when: [case.web_hygiene]
    closes_with:
      adapter: http.web-hygiene
      check: cookies
      scope: partial
      limits: >-
        Reads only the Set-Cookie attributes (Secure, SameSite) on the one probe response;
        storage, workers and other isolation headers are not exercised.
      limits_pt: "Lê apenas os atributos do Set-Cookie (Secure, SameSite) na resposta da única sondagem; armazenamento, workers e outros cabeçalhos de isolamento não são exercitados."
  "5.20.1":
    weight: essential
    label: Disclosure in responses, errors and published files
    coverage_class: information_disclosure
    applies_when: [case.web_hygiene]
    closes_with:
      adapter: http.web-hygiene
      check: disclosure
      scope: partial
      limits: >-
        Reads only the Server and X-Powered-By headers on the one probe response; error bodies,
        logs, backups, published files and build artifacts are not exercised.
      limits_pt: "Lê apenas os cabeçalhos Server e X-Powered-By na resposta da única sondagem; corpos de erro, logs, backups, arquivos publicados e artefatos de build não são exercitados."
