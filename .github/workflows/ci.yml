name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-pytest-base-fixes:
    name: Upstream base fixes (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate the current upstream base with all four fixes
        run: timeout --signal=INT --kill-after=15s 7m uv run --frozen pytest -q -o faulthandler_timeout=120
