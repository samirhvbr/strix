name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-pytest-stack:
    name: Upstream pytest stack (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Capture the upstream pytest stack
        run: timeout --signal=INT --kill-after=15s 5m uv run --frozen pytest -q -o faulthandler_timeout=120
