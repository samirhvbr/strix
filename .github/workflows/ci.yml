name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-upstream-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
      - name: Diagnose the unchanged upstream test suite
        run: timeout --kill-after=10s 8m uv run --frozen pytest -vv -o faulthandler_timeout=45
